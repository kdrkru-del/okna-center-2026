<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <!-- Red squircle badge -->
  <rect width="512" height="512" rx="118" fill="url(#redGrad)"/>
  <!-- White architectural window frame -->
  <rect x="82" y="82" width="348" height="348" rx="26" fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Window mullions (vertical and horizontal cross dividers) -->
  <line x1="256" y1="82" x2="256" y2="430" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round"/>
  <line x1="82" y1="256" x2="430" y2="256" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round"/>
</svg>