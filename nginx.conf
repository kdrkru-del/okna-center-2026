server {
    listen 80;
    server_name xn--80aknmcbtp7a.xn--p1ai www.xn--80aknmcbtp7a.xn--p1ai;
    return 301 https://xn--80aknmcbtp7a.xn--p1ai$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.xn--80aknmcbtp7a.xn--p1ai;
    
    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/xn--80aknmcbtp7a.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80aknmcbtp7a.xn--p1ai/privkey.pem;

    # Canonical redirect to non-www
    return 301 https://xn--80aknmcbtp7a.xn--p1ai$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xn--80aknmcbtp7a.xn--p1ai;

    root /var/www/okna_center/out;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/xn--80aknmcbtp7a.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80aknmcbtp7a.xn--p1ai/privkey.pem;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 301 REDIRECTS FOR LEGACY URLS
    location = /undefined { return 301 /; }
    location = /okna { return 301 /kupit_plastikovye_okna_vladivostok/; }
    location = /balkon_pod_klyuch_vladivostok { return 301 /osteklenie_balkona_vladivostok/; }
    location = /lodzhii { return 301 /lodgia_pod_klyuch_vladivostok/; }
    location = /osteklenie_lodgiy_vladivostok { return 301 /lodgia_pod_klyuch_vladivostok/; }
    location = /plastikovie_okna_vo_vladivostoke { return 301 /kupit_plastikovye_okna_vladivostok/; }
    location = /plastikovie_okna_vo_vladivostoke_2_2 { return 301 /kupit_plastikovye_okna_vladivostok/; }
    location = /stienovyie_panieli_mdf { return 301 /otdielochnyie_matierialy/; }
    location = /osteklenie_balkona { return 301 /osteklenie_balkona_vladivostok/; }
    location = /remont_plastikovyh_okon_vladivostok_2 { return 301 /remont_plastikovyh_okon_vladivostok/; }

    # Static assets caching
    location /_next/static/ {
        expires 365d;
        access_log off;
    }

    location /images/ {
        expires 30d;
        access_log off;
    }


    # Block dev routes in production
    location /variants {
        return 404;
    }

    # Clean URLs with trailing slash support
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404/index.html;
}
